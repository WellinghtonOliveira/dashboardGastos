<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Painel de Controle - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h2 {
      color: white;
      margin-bottom: 20px;
      text-align: center;
      font-size: 24px;
    }

    .control-panel {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    h3 {
      color: #333;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      color: #555;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .transaction-list {
      margin-top: 30px;
      max-height: 350px;
      overflow-y: auto;
    }

    .transaction-item {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .transaction-item.saida {
      border-left-color: #ff4d4d;
    }

    .transaction-item.entrada {
      border-left-color: #00ffa3;
    }

    .trans-info {
      flex: 1;
    }

    .trans-descricao {
      font-weight: 600;
      color: #333;
    }

    .trans-categoria {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .trans-valor {
      font-weight: bold;
      margin-right: 10px;
      min-width: 80px;
      text-align: right;
    }

    .trans-valor.entrada {
      color: #00ffa3;
    }

    .trans-valor.saida {
      color: #ff4d4d;
    }

    .btn-delete {
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      margin-left: 10px;
    }

    .btn-delete:hover {
      background: #cc3333;
    }

    .error {
      color: #ff4d4d;
      font-size: 12px;
      margin-bottom: 10px;
      padding: 8px;
      background: #ffe6e6;
      border-radius: 4px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .success {
      color: #00ffa3;
      font-size: 12px;
      margin-bottom: 10px;
      padding: 8px;
      background: #e6ffe6;
      border-radius: 4px;
      display: none;
    }

    .success.show {
      display: block;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>💰 Painel de Controle</h2>
    <div class="control-panel">
      <h3>➕ Novo Lançamento</h3>
      
      <div class="error" id="error-msg"></div>
      <div class="success" id="success-msg"></div>

      <div class="form-group">
        <label for="f-desc">Descrição</label>
        <input type="text" placeholder="Ex: Almoço no restaurante" id="f-desc">
      </div>

      <div class="form-group">
        <label for="f-val">Valor (R$)</label>
        <input type="number" placeholder="0.00" id="f-val" step="0.01" min="0">
      </div>

      <div class="form-group">
        <label for="f-tipo">Tipo</label>
        <select id="f-tipo">
          <option value="saida">💸 Saída (Gasto)</option>
          <option value="entrada">💵 Entrada (Renda)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="f-cat">Categoria</label>
        <select id="f-cat">
          <option value="Alimentação">🍔 Alimentação</option>
          <option value="Transporte">🚗 Transporte</option>
          <option value="Saúde">⚕️ Saúde</option>
          <option value="Lazer">🎮 Lazer</option>
          <option value="Educação">📚 Educação</option>
          <option value="Trabalho">💼 Trabalho</option>
          <option value="Fixo">📌 Fixo</option>
          <option value="Outros">📦 Outros</option>
        </select>
      </div>

      <button id="add-btn">✅ Adicionar Transação</button>

      <div class="list-header">
        Histórico de Transações
        <span id="trans-count" style="color: #667eea;">0</span>
      </div>

      <div class="transaction-list" id="transaction-list"></div>
    </div>
  </div>

  <script src="./js/control.js"></script>
</body>

</html>
