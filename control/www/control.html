<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle - Dashboard</title>
  <link rel="stylesheet" href="./css/control.css">
  <style>
    /* Forçar ocultação de todas as scrollbars */
    html, body {
      overflow: hidden !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    html::-webkit-scrollbar, 
    body::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
  </style>
</head>

<body>
  <!-- Container de alertas flutuantes -->
  <div class="alert-container" id="alert-container">
    <div class="alert" id="alert-msg"></div>
  </div>
  
  <div class="container">
    <div class="app-header">
      <h1>💰 Painel de Controle</h1>
      <p class="subtitle">Gerencie suas finanças</p>
    </div>
    
    <div class="control-panel">
      <!-- Seção do Formulário -->
      <div class="form-section">
        <div class="panel-header">
          <span class="icon">➕</span>
          <h3>Novo Lançamento</h3>
        </div>

        <div class="form-group">
          <label for="f-desc">Descrição</label>
          <input type="text" placeholder="Ex: Almoço no restaurante" id="f-desc">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="f-val">Valor (R$)</label>
            <input type="number" placeholder="0.00" id="f-val" step="0.01" min="0">
          </div>

          <div class="form-group">
            <label for="f-tipo">Tipo</label>
            <select id="f-tipo">
              <option value="saida">💸 Saída</option>
              <option value="entrada">💵 Entrada</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="f-cat">Categoria</label>
          <select id="f-cat">
            <option value="Alimentação">🍔 Alimentação</option>
            <option value="Transporte">🚗 Transporte</option>
            <option value="Saúde">⚕️ Saúde</option>
            <option value="Lazer">🎮 Lazer</option>
            <option value="Educação">📚 Educação</option>
            <option value="Trabalho">💼 Trabalho</option>
            <option value="Fixo">📌 Fixo</option>
            <option value="Outros">📦 Outros</option>
          </select>
        </div>

        <button class="btn-primary" id="add-btn">
          <span>➕</span>
          Adicionar Transação
        </button>
      </div>

      <!-- Seção da Lista -->
      <div class="list-section">
        <div class="list-header">
          <h4>📋 Histórico de Transações</h4>
          <span class="count" id="trans-count">0</span>
        </div>

        <div class="transaction-list" id="transaction-list">
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>Nenhuma transação ainda</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/control.js"></script>
</body>

</html>
